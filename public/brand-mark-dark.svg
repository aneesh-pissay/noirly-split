<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noirly Split mark">
  <title>Noirly Split — monochrome</title>
  <desc>A whole with its share pulled out: one bill, divided fairly.</desc>
  <!-- Default tint for standalone use. Delete this rule to inherit color from the parent.
       Plain currentColor shapes only (no masks/clipPaths) so theming code can recolor it safely. -->
  <style>svg { color: #C9A44A; }</style>
  <!-- The whole, with one share pulled out -->
  <path fill="currentColor" stroke="currentColor" stroke-width="24" stroke-linejoin="round"
        d="M536 536 V236 A300 300 0 1 1 236 536 Z"/>
  <path fill="currentColor" stroke="currentColor" stroke-width="24" stroke-linejoin="round"
        d="M484 484 H184 A300 300 0 0 1 484 184 Z"/>
</svg>
